# Конфигурация сервиса коротких ссылок.
# Все ключевые параметры читаются отсюда — в коде ничего не зашито (см. README, раздел "Конфигурация").

# Время жизни ссылки. Задаётся системой, пользователь его выбрать не может (ТЗ, этап 2.3).
# Формат: ISO-8601 (PT24H) или сокращённый суффиксный (45m, 24h, 7d, 30s).
link.ttl=24h

# Лимит переходов по умолчанию, если пользователь не указал свой.
link.redirect-limit.default=50

# Границы лимита переходов: пользователь не может выйти за эти значения.
link.redirect-limit.min=1
link.redirect-limit.max=1000

# Длина короткого кода (алфавит base62: 0-9, A-Z, a-z). Допустимо 4..12.
link.code-length=6

# Базовый URL сервиса — используется для вывода полной короткой ссылки и для защиты
# от сокращения собственных ссылок (цикл редиректа).
service.base-url=https://clck.ru/

# Максимальная длина исходного URL.
link.url.max-length=2048

# Автоочистка: периодическое удаление ссылок с истёкшим временем жизни.
cleanup.enabled=true
cleanup.interval=1m

# Уведомления владельцу ссылок (исчерпан лимит / истёк срок жизни).
notifications.enabled=true

# Открывать ли браузер при переходе. false — ссылка выводится в консоль для ручного открытия.
browser.open=true
